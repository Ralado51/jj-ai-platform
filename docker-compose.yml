services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jj-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - jj_ai_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jj-ai-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: jj-ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - jj_ai_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.routers.jj-ai-minio-console.rule=Host(`${MINIO_CONSOLE_DOMAIN}`)"
      - "traefik.http.routers.jj-ai-minio-console.entrypoints=websecure"
      - "traefik.http.routers.jj-ai-minio-console.tls=true"
      - "traefik.http.routers.jj-ai-minio-console.tls.certresolver=leresolver"
      - "traefik.http.services.jj-ai-minio-console.loadbalancer.server.port=9001"
      - "traefik.http.routers.jj-ai-minio-api.rule=Host(`${MINIO_API_DOMAIN}`)"
      - "traefik.http.routers.jj-ai-minio-api.entrypoints=websecure"
      - "traefik.http.routers.jj-ai-minio-api.tls=true"
      - "traefik.http.routers.jj-ai-minio-api.tls.certresolver=leresolver"
      - "traefik.http.services.jj-ai-minio-api.loadbalancer.server.port=9000"
    networks:
      - jj-ai-network
      - portainer_default

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jj-ai-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      FRONTEND_URL: ${FRONTEND_URL}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-https://files.jjnetwork.com.br}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-jj-ai-projects}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    ports:
      - "${API_PORT}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.routers.jj-ai-api.rule=Host(`api.jjnetwork.com.br`)"
      - "traefik.http.routers.jj-ai-api.entrypoints=websecure"
      - "traefik.http.routers.jj-ai-api.tls=true"
      - "traefik.http.routers.jj-ai-api.tls.certresolver=leresolver"
      - "traefik.http.services.jj-ai-api.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jj-ai-network
      - portainer_default

volumes:
  jj_ai_postgres_data:
  jj_ai_minio_data:

networks:
  jj-ai-network:
    driver: bridge
  portainer_default:
    external: true
