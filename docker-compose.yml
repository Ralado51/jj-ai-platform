services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jj-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - jj_ai_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jj-ai-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jj-ai-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "${API_PORT}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.routers.jj-ai-api.rule=Host(`api.jjnetwork.com.br`)"
      - "traefik.http.routers.jj-ai-api.entrypoints=websecure"
      - "traefik.http.routers.jj-ai-api.tls=true"
      - "traefik.http.routers.jj-ai-api.tls.certresolver=leresolver"
      - "traefik.http.services.jj-ai-api.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jj-ai-network
      - portainer_default

volumes:
  jj_ai_postgres_data:

networks:
  jj-ai-network:
    driver: bridge
  portainer_default:
    external: true
